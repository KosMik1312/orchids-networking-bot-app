# ============================================
# Nginx для Jino VPS (Orchids / Antre Club)
# ============================================
#
# ВАЖНО: Jino VPS проксирует так:
#   Внешний порт 80/443 → Внутренний порт 80
#   SSL терминируется на стороне Jino!
#
# Поэтому nginx НЕ должен:
#   - Слушать порт 443 (Jino не пересылает на него)
#   - Делать redirect на HTTPS (SSL уже обработан Jino)
#   - Иметь собственные SSL-сертификаты
#
# CORS обрабатывается ТОЛЬКО в FastAPI.
# ============================================

# --- Основной сервер на порту 80 ---
server {
    listen 80;
    listen [::]:80;
    server_name api.leracinema.ru;

    client_max_body_size 100M;

    location / {
        # Проксирование на FastAPI
        proxy_pass http://127.0.0.1:8000;

        # Заголовки проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# --- Основной домен → Vercel ---
server {
    listen 80;
    listen [::]:80;
    server_name leracinema.ru www.leracinema.ru;

    location / {
        return 301 https://orchids-networking-bot-app.vercel.app$request_uri;
    }
}
