# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name leracinema.ru api.leracinema.ru www.leracinema.ru;
    return 301 https://$server_name$request_uri;
}

# HTTPS for API subdomain
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.leracinema.ru;

    ssl_certificate /etc/letsencrypt/live/leracinema.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leracinema.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100M;

    location / {
        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Standard CORS headers for all requests
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# HTTPS for main domain - redirect to Vercel
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name leracinema.ru www.leracinema.ru;

    ssl_certificate /etc/letsencrypt/live/leracinema.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leracinema.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        return 301 https://orchids-networking-bot-app.vercel.app;
    }
}
